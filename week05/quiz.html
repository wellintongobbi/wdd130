<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <meta name="author" content="wellinton Allan Gobbi">
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>Basic HTML and CSS Quiz</h1>
        <form class="box">
            <div class="quiz-item box">
                <label for="q1">1. What does HTML stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>
            <div class="quiz-item box">
                <label for="q2">2. Explain the difference between a class and an id in CSS.</label>
                <textarea id="q2" name="q2"></textarea>
            </div>
            <div class="quiz-item box">
                <label for="q3">3. Which HTML tag is used to create a hyperlink?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose one...</option>
                    <option value="a">&lt;a&gt;</option>
                    <option value="b">&lt;link&gt;</option>
                    <option value="c">&lt;href&gt;</option>
                </select>
            </div>
            <div class="quiz-item box">
                <label for="q4">4. How many heading levels are available in HTML?</label>
                <input type="number" id="q4" name="q4">
            </div>
            <button type="submit">Submit</button>
        </form>
    </main>
</body>

</html>
